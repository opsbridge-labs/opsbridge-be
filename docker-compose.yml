services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: "postgres://app:app@localhost:5432/app"
  db:
    image: postgres:16
    environment:
      MYSQL_ROOT_PASSWORD: app
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
